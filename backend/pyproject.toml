[project]
name = "ffe-opening-coach"
version = "0.1.0"
description = "POC d'agent d'entraînement aux ouvertures pour la FFE"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "fastembed==0.7.1",
  "httpx==0.28.1",
  "langgraph==0.6.7",
  "pydantic-settings==2.10.1",
  "pymilvus==2.6.1",
  "pymongo==4.14.1",
  "python-chess==1.999",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
